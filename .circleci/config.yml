version: 2.1

references:
  setup_env: &setup_env
    docker:
      - image: cimg/node:24.21.0
  setup_env_browser: &setup_env_browser
    docker:
      - image: cimg/node:24.21.0-browsers
        environment:
            CHROME_BIN: "/usr/bin/google-chrome"
  save_cache: &save_cache
    key: v2-dependency-cache-{{ checksum "yarn.lock" }}
    paths:
      - node_modules
  restore_cache: &restore_cache
    keys:
      - v2-dependency-cache-{{ checksum "yarn.lock" }}
      - v2-dependency-cache-
  persist_to_workspace: &persist_to_workspace
    root: '.'
    paths:
      - build
      - dist
      - plottable.*
  release_tag_filter: &release_tag_filter
    tags:
      only: /^v[0-9.]+.*/

jobs:
  install:
    <<: *setup_env
    steps:
      - checkout
      - attach_workspace:
          at: '.'
      - restore_cache: *restore_cache
      - run: yarn --frozen-lockfile
      - save_cache: *save_cache
      - persist_to_workspace:
          root: '.'
          paths:
            - yarn.lock

  test:
    <<: *setup_env_browser
    steps:
      - checkout
      - attach_workspace:
          at: '.'
      - restore_cache: *restore_cache
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:ci
      - persist_to_workspace: *persist_to_workspace

  demo:
    <<: *setup_env
    steps:
      - checkout
      - attach_workspace:
          at: '.'
      - restore_cache: *restore_cache
      - run: yarn start:update-quicktests
      - run: ./scripts/submit-comment-with-artifact-links.js || true
      - store_artifacts:
          path: plottable.css
      - store_artifacts:
          path: plottable.js
      - store_artifacts:
          path: quicktests
      - store_artifacts:
          path: node_modules/d3
      - store_artifacts:
          path: node_modules/jquery
      - store_artifacts:
          path: node_modules/requirejs
      - persist_to_workspace: *persist_to_workspace

  dist:
    <<: *setup_env
    steps:
      - checkout
      - attach_workspace:
          at: '.'
      - restore_cache: *restore_cache
      - run: yarn dist
      - persist_to_workspace: *persist_to_workspace

  publish:
    <<: *setup_env
    steps:
      - checkout
      - attach_workspace:
          at: '.'
      - restore_cache: *restore_cache
      - run: git diff HEAD..origin/develop --quiet || (echo "dist not built"; exit 1)
      - run: npm run -s check_version || (echo "package.json version not updated"; exit 1)
      - run:
          name: Publish release using CircleCI OIDC
          command: |
            # From https://docs.npmjs.com/trusted-publishers#circleci-configuration
            NPM_ID_TOKEN="$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')"
            export NPM_ID_TOKEN
            npm publish
      - persist_to_workspace: *persist_to_workspace

  publish-snapshot:
    <<: *setup_env
    steps:
      - checkout
      - attach_workspace:
          at: '.'
      - restore_cache: *restore_cache
      - run:
          name: Publish snapshot using CircleCI OIDC
          command: |
            # From https://docs.npmjs.com/trusted-publishers#circleci-configuration
            NPM_ID_TOKEN="$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')"
            export NPM_ID_TOKEN
            ./scripts/publishSnapshot.sh
      - persist_to_workspace: *persist_to_workspace
  circle-all:
    docker:
    - image: busybox:1.34.1
    resource_class: small
    steps:
    - run:
        command: echo "All required jobs finished successfully"

workflows:
  version: 2
  plottable:
    jobs:
      - install:
          filters: *release_tag_filter
      - test:
          requires: [install]
          filters: *release_tag_filter
      - demo:
          requires: [test]
          filters: *release_tag_filter
      - dist:
          requires: [test]
          filters: *release_tag_filter
      - publish:
          requires: [test, dist]
          filters:
            <<: *release_tag_filter
            branches:
              ignore: /.*/
      - publish-snapshot:
          requires: [test, dist]
          filters:
            branches:
              only: develop
      - circle-all:
          requires:
          - test
          - install
          - dist
          - demo
          filters:
            tags:
              only: /.*/
